name: tas4_mysql_phpmyadmin

services:
  mysql:
    image: mysql:8.4
    container_name: tas4_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env.local}
      MYSQL_USER: ${MYSQL_USER:?Define MYSQL_USER en .env.local}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env.local}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - red_tas4
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql -uroot -N -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    container_name: tas4_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_VERBOSE: MySQL - Practica TAS4
      UPLOAD_LIMIT: 32M
    ports:
      - "127.0.0.1:${PMA_HTTP_PORT:-8084}:80"
    networks:
      - red_tas4
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

networks:
  red_tas4:
    name: tas4_red
    driver: bridge

volumes:
  mysql_data:
    name: tas4_mysql_data
